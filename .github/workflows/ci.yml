# Tests every push; builds and smoke-tests the Docker image; publishes it to
# ghcr.io/<owner>/hive-mcp from main (tag "latest") and from v* tags (semver tags).
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pull requests from branches of this repo are already covered by the push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (linux/amd64) for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hive-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          key="hv_key_ci_$(openssl rand -hex 24)"
          docker run -d --name hive -p 8787:8787 -e HIVE_ADMIN_KEY="$key" hive-mcp:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8787/healthz && break; sleep 1; done
          echo
          curl -fsS http://localhost:8787/healthz | jq -e '.ok == true'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8787/mcp -H 'content-type: application/json' -d '{}')
          test "$code" = 401 || { echo "expected 401 without a token, got $code"; exit 1; }
          curl -fsS -X POST http://localhost:8787/mcp \
            -H "authorization: Bearer $key" -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"hive_whoami","arguments":{}}}' \
            | jq -e '.result.content[0].text | fromjson | .member.role == "admin"'
          docker exec hive hive-admin users | grep -q admin
          echo "container smoke test passed"

      - name: Container logs
        if: always()
        run: docker logs hive 2>&1 | grep -v hv_key_ || true

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        if: env.PUBLISH == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=hive-mcp
            org.opencontainers.image.description=Shared knowledge base, logs and task queue for teams of Claude agents (remote MCP server / Claude custom connector)

      - name: Build and push (linux/amd64, linux/arm64)
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
